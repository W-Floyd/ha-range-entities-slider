name: Release

# On a version tag: render the card against a real Home Assistant, attach the
# screenshots to the release, and rewrite the release notes as the changelog
# entry for that version plus a gallery of those screenshots.
#
# The rendering is not repeated here — it calls the Render workflow, which is
# also what runs on pushes and weekly.
#
# Screenshots go on as release assets rather than workflow artifacts: artifacts
# expire (90 days by default), release assets do not, and their URLs are
# deterministic, so the notes can link them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release notes for
        required: true

permissions:
  contents: write

jobs:
  render:
    uses: ./.github/workflows/render.yml
    with:
      ha_versions: '["stable"]'
      sweep: true
      artifact_prefix: release-screenshots

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-screenshots-stable
          path: tests/screenshots

      # The card is built rather than committed, so the asset has to be built
      # here before it can be attached.
      - name: Build the card
        run: tools/build.sh

      # Only what the notes actually link to. The same run also records
      # comparison and diagnostic crops — a stock row held mid-drag, magnified
      # handles, the card with its styling detached — which exist to be diffed
      # against during development, not attached to a release. The theme
      # captures come from the sweep's manifest for that reason, and are
      # prefixed because release assets are a flat namespace.
      - name: Collect the screenshots
        run: |
          mkdir -p upload
          for file in tests/screenshots/overview-*-light.png tests/screenshots/overview-*-dark.png; do
            cp "$file" upload/
          done
          node -e '
            const {readFileSync, copyFileSync} = require("node:fs");
            for (const {file} of JSON.parse(readFileSync("tests/screenshots/themes/manifest.json", "utf8"))) {
              copyFileSync(`tests/screenshots/themes/${file}`, `upload/theme-${file}`);
            }
          '
          ls -la upload

      - name: Compose the release notes
        id: notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          {
            node scripts/changelog.mjs notes "$VERSION"
            echo
            echo
            node scripts/gallery.mjs "$TAG"
          } > notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          wc -l notes.md

      # `just release` may have created the release already; either way this
      # ends with the same assets and notes.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "pending screenshots"
          fi
          gh release upload "$TAG" ha-range-entities-slider.js upload/*.png --clobber
          gh release edit "$TAG" --notes-file notes.md
