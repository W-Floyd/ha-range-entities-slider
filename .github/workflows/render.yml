name: Render

# Renders the card in a real Home Assistant and checks it. The weekly run is the
# point of the matrix: the card patches ha-slider's private shadow DOM by id, so
# an upstream frontend change can break it without this repo changing at all.
#
# Also callable by other workflows (the release builds its screenshots this way)
# so the render is defined once.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ha_versions:
        description: JSON array of Home Assistant image tags to render against
        type: string
        default: '["stable", "beta"]'
      sweep:
        description: Also install the custom themes and capture the row in each
        type: boolean
        default: false
      artifact_prefix:
        description: Prefix for the uploaded screenshot artifacts
        type: string
        default: screenshots

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha_version: ${{ fromJSON(inputs.ha_versions || '["stable", "beta"]') }}
    steps:
      - uses: actions/checkout@v4

      # Keyed on what the packs currently point at, so a theme release fetches
      # the new tarball. Tarballs are named per commit, so a partial restore
      # still spares every pack that has not moved.
      - name: Resolve theme versions
        if: inputs.sweep
        id: themes
        run: |
          echo "key=$(tests/install-themes.sh --versions | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache theme downloads
        if: inputs.sweep
        uses: actions/cache@v4
        with:
          path: tests/.theme-cache
          key: themes-${{ steps.themes.outputs.key }}
          restore-keys: themes-

      # Identifies this render by the card, the tests, the settings and the
      # remote digest of the Home Assistant image, so an unchanged run restores
      # its screenshots instead of spending ninety seconds reproducing them.
      - name: Fingerprint the render
        id: fingerprint
        env:
          SWEEP_THEMES: ${{ inputs.sweep && '1' || '0' }}
        run: |
          echo "key=$(tests/render.sh --fingerprint ${{ matrix.ha_version }})" >> "$GITHUB_OUTPUT"

      - name: Restore an identical render
        uses: actions/cache@v4
        with:
          path: |
            tests/screenshots
            tests/.render-cache
          key: render-${{ steps.fingerprint.outputs.key }}

      # The weekly run exists to re-verify against the live world, so it never
      # takes the cached answer: the card loads Lit from unpkg at runtime, which
      # floats across 2.x and so is in nothing the fingerprint covers.
      - name: Render against Home Assistant ${{ matrix.ha_version }}
        env:
          SWEEP_THEMES: ${{ inputs.sweep && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RENDER: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: tests/render.sh ${{ matrix.ha_version }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix || 'screenshots' }}-${{ matrix.ha_version }}
          path: tests/screenshots/
          if-no-files-found: warn

  # Downloads the custom theme packs and captures the row under a curated set of
  # them. Kept off the push/PR path because it pulls nine repositories and
  # renders 18 combinations. Skipped when this workflow is called, since the
  # caller asks for the sweep through the `sweep` input instead.
  themes:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve theme versions
        id: themes
        run: |
          echo "key=$(tests/install-themes.sh --versions | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache theme downloads
        uses: actions/cache@v4
        with:
          path: tests/.theme-cache
          key: themes-${{ steps.themes.outputs.key }}
          restore-keys: themes-

      - name: Fingerprint the render
        id: fingerprint
        env:
          SWEEP_THEMES: "1"
        run: |
          echo "key=$(tests/render.sh --fingerprint stable)" >> "$GITHUB_OUTPUT"

      - name: Restore an identical render
        uses: actions/cache@v4
        with:
          path: |
            tests/screenshots
            tests/.render-cache
          key: render-${{ steps.fingerprint.outputs.key }}

      - name: Render under custom themes
        env:
          SWEEP_THEMES: "1"
          # Raises the GitHub API rate limit for the theme tarball downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # As above: the scheduled run always renders rather than restoring.
          FORCE_RENDER: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: tests/render.sh stable

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-themes
          path: tests/screenshots/
          if-no-files-found: warn
