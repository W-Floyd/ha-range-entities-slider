name: Render

# Renders the card in a real Home Assistant and checks it.
#
# The scheduled callers are the point: the card patches ha-slider's private
# shadow DOM by id, so an upstream frontend change can break it without this
# repo changing at all. A run whose fingerprint matches the last one restores
# its screenshots instead of rendering, so a scheduled check costs seconds
# unless Home Assistant, a theme pack, or the Lit build has actually moved.

# Callable only. The triggers live in the workflows that call it — stable.yml,
# beta.yml, themes.yml and release.yml — so each gets its own status badge.
on:
  workflow_call:
    inputs:
      ha_versions:
        description: JSON array of Home Assistant image tags to render against
        type: string
        default: '["stable", "beta"]'
      sweep:
        description: Also install the custom themes and capture the row in each
        type: boolean
        default: false
      artifact_prefix:
        description: Prefix for the uploaded screenshot artifacts
        type: string
        default: screenshots
      browsers:
        description: >
          JSON array of engines to drive. The published screenshots come from
          Chromium; the others check that the row behaves the same in engines
          Home Assistant is used in, which is how the handle's held styling was
          found to depend on a :has() rule Firefox matches but never restyles.
        type: string
        default: '["chromium"]'
      theme_filter:
        description: >
          Narrows the sweep to the themes whose names contain one of these
          comma-separated strings, so a second engine can be checked against the
          theme that styles the drag without paying for every pack.
        type: string
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha_version: ${{ fromJSON(inputs.ha_versions || '["stable", "beta"]') }}
        browser: ${{ fromJSON(inputs.browsers || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7

      # Keyed on what the packs currently point at, so a theme release fetches
      # the new tarball. Tarballs are named per commit, so a partial restore
      # still spares every pack that has not moved.
      # Resolved once and passed to the render through THEME_PINS, so the cache
      # key, the download and the recorded versions cannot disagree if a pack
      # moves mid-run.
      - name: Resolve theme versions
        if: inputs.sweep
        id: themes
        run: |
          tests/install-themes.sh --versions > theme-pins.txt
          echo "key=$(shasum -a 256 theme-pins.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat theme-pins.txt

      - name: Cache theme downloads
        if: inputs.sweep
        uses: actions/cache@v6
        with:
          path: tests/.theme-cache
          key: themes-${{ steps.themes.outputs.key }}
          restore-keys: themes-

      # Identifies this render by the card, the tests, the settings and the
      # remote digest of the Home Assistant image, so an unchanged run restores
      # its screenshots instead of spending ninety seconds reproducing them.
      - name: Fingerprint the render
        id: fingerprint
        env:
          SWEEP_THEMES: ${{ inputs.sweep && '1' || '0' }}
          THEME_PINS: ${{ inputs.sweep && 'theme-pins.txt' || '' }}
          THEME_FILTER: ${{ inputs.theme_filter }}
          BROWSER: ${{ matrix.browser }}
        run: |
          echo "key=$(tests/render.sh --fingerprint ${{ matrix.ha_version }})" >> "$GITHUB_OUTPUT"

      - name: Restore an identical render
        uses: actions/cache@v6
        with:
          path: |
            tests/screenshots
            tests/.render-cache
          key: render-${{ steps.fingerprint.outputs.key }}

      - name: Render against Home Assistant ${{ matrix.ha_version }} in ${{ matrix.browser }}
        env:
          SWEEP_THEMES: ${{ inputs.sweep && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME_PINS: ${{ inputs.sweep && 'theme-pins.txt' || '' }}
          THEME_FILTER: ${{ inputs.theme_filter }}
          BROWSER: ${{ matrix.browser }}
        run: tests/render.sh ${{ matrix.ha_version }}

      # Chromium keeps the plain name: release.yml downloads it by name, and the
      # screenshots the README and the releases show are its.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'screenshots' }}-${{ matrix.ha_version }}${{ matrix.browser == 'chromium' && '' || format('-{0}', matrix.browser) }}
          path: tests/screenshots/
          if-no-files-found: warn
