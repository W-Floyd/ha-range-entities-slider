name: Themes

# Installs the custom theme packs and captures the row under a curated set of
# them. Weekly rather than daily: it resolves nine repositories, though an
# unchanged set is restored rather than re-rendered.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  themes:
    uses: ./.github/workflows/render.yml
    with:
      ha_versions: '["stable"]'
      sweep: true
      artifact_prefix: screenshots-themes
