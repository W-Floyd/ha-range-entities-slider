title: Render Test
views:
  - title: Card
    cards:
      # A single list: the custom row sits directly above the stock
      # input_number slider rows it is modelled on, so the screenshots double as
      # a side-by-side comparison, with the boundary and degenerate pairs below.
      # Each row below is asserted by tests/render.mjs.
      - type: entities
        title: Range Entity Row
        entities:
          - type: custom:range-entity-row
            entity: input_number.drag_low
            range_entity: input_number.drag_high
            name: Dragging
            icon: mdi:gesture-swipe-horizontal
          - type: custom:range-entity-row
            entity: input_number.lower_temp
            range_entity: input_number.upper_temp
            name: Temperature Range
            icon: mdi:thermometer
          - entity: input_number.lower_temp
            name: Lower Temp (stock row)
          - entity: input_number.upper_temp
            name: Upper Temp (stock row)

          - type: section
            label: Edge cases
          - type: custom:range-entity-row
            entity: input_number.span_low
            range_entity: input_number.span_high
            name: Full span (min/max)
          - type: custom:range-entity-row
            entity: input_number.inverted_low
            range_entity: input_number.inverted_high
            name: Inverted (upper < lower)
          - type: custom:range-entity-row
            entity: input_number.inverted_low
            range_entity: input_number.inverted_high
            name: Inverted (warning off)
            warn_inverted: false
          - type: custom:range-entity-row
            entity: input_number.equal_low
            range_entity: input_number.equal_high
            name: Equal values
          - type: custom:range-entity-row
            entity: input_number.whole_low
            range_entity: input_number.whole_high
            name: Whole-number step
          - type: custom:range-entity-row
            entity: number.number_low
            range_entity: number.number_high
            name: number domain
          - type: custom:range-entity-row
            entity: input_number.narrow_low
            range_entity: input_number.narrow_high
            name: Mismatched ranges
          - type: custom:range-entity-row
            entity: input_number.action_low
            range_entity: input_number.action_high
            name: Value actions
            value_tap_action:
              action: none
            range_value_hold_action:
              action: more-info
          - type: custom:range-entity-row
            entity: number.number_offline
            range_entity: number.number_high
            name: Unavailable entity
          - entity: number.number_offline
            name: Unavailable (stock row)
          - type: custom:range-entity-row
            entity: input_number.does_not_exist
            range_entity: input_number.upper_temp
            name: Missing entity
