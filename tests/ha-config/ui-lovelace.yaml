title: Render Test
views:
  - title: Card
    cards:
      # The custom row sits directly above the stock input_number slider rows it
      # is modeled on, so the screenshots double as a side-by-side comparison.
      - type: entities
        title: Range Entity Row
        entities:
          - type: custom:range-entity-row
            entity: input_number.lower_temp
            range_entity: input_number.upper_temp
            name: Temperature Range
            icon: mdi:thermometer
          - entity: input_number.lower_temp
            name: Lower Temp (stock row)
          - entity: input_number.upper_temp
            name: Upper Temp (stock row)

      # Boundary and degenerate pairs. Each is asserted by tests/render.mjs and
      # captured in the screenshots.
      - type: entities
        title: Edge cases
        entities:
          - type: custom:range-entity-row
            entity: input_number.span_low
            range_entity: input_number.span_high
            name: Full span (min/max)
          - type: custom:range-entity-row
            entity: input_number.inverted_low
            range_entity: input_number.inverted_high
            name: Inverted (upper < lower)
          - type: custom:range-entity-row
            entity: input_number.inverted_low
            range_entity: input_number.inverted_high
            name: Inverted (warning disabled)
            warn_inverted: false
          - type: custom:range-entity-row
            entity: input_number.equal_low
            range_entity: input_number.equal_high
            name: Equal values
          - type: custom:range-entity-row
            entity: input_number.whole_low
            range_entity: input_number.whole_high
            name: Whole-number step
