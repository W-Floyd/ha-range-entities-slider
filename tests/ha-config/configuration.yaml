# Minimal Home Assistant config used only by the render test.
# This directory is copied to a temp dir before each run, so Home Assistant's
# generated .storage never lands in the repo.

frontend:
  # Empty when the theme sweep is off; populated by tests/install-themes.sh.
  themes: !include_dir_merge_named themes

# ha-lcars reads these exact entity ids from its card-mod templates and
# interpolates them straight into CSS — the numbers are pixel sizes, the toggles
# gate effects. Every one has a built-in fallback, so they are optional; the
# values below are the theme's own defaults, so the captures look like a stock
# LCARS install rather than one that has been fiddled with.
input_boolean:
  lcars_sound:
    name: LCARS Sound
  lcars_texture:
    name: LCARS Texture

template:
  - sensor:
      - name: LCARS Header
        state: "LCARS"

  # number entities, the modern equivalent of input_number, backed by helpers so
  # the row can actually write to them.
  - number:
      - name: Number Low
        unique_id: number_low
        state: "{{ states('input_number.number_low_store') }}"
        min: 0
        max: 100
        step: 1
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.number_low_store
            data:
              value: "{{ value }}"
      - name: Number High
        unique_id: number_high
        state: "{{ states('input_number.number_high_store') }}"
        min: 0
        max: 100
        step: 1
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.number_high_store
            data:
              value: "{{ value }}"
      # Never available, so the row has an unavailable entity to render.
      - name: Number Offline
        unique_id: number_offline
        availability: "{{ false }}"
        state: "0"
        min: 0
        max: 100
        step: 1
        set_value: []

input_number:
  # --lcars-vertical-border and --lcars-middle-vertical-border, in px
  lcars_vertical:
    name: LCARS Vertical
    min: 26
    max: 60
    step: 1
    initial: 35
  # --lcars-horizontal-border, in px
  lcars_horizontal:
    name: LCARS Horizontal
    min: 6
    max: 60
    step: 1
    initial: 10
  # --menu-font-size for the sidebar, in px
  lcars_menu_font:
    name: LCARS Menu Font
    min: 6
    max: 60
    step: 1
    initial: 24

  lower_temp:
    name: Lower Temp
    min: 15
    max: 30
    step: 0.5
    initial: 18
    unit_of_measurement: "°C"
  upper_temp:
    name: Upper Temp
    min: 15
    max: 30
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"

  # Both handles pinned to the ends of the range.
  span_low:
    name: Span Low
    min: 15
    max: 30
    step: 0.5
    initial: 15
    unit_of_measurement: "°C"
  span_high:
    name: Span High
    min: 15
    max: 30
    step: 0.5
    initial: 30
    unit_of_measurement: "°C"

  # Deliberately inverted: the entity behind the lower handle holds the larger
  # value, so the card has to normalise the pair.
  inverted_low:
    name: Inverted Low
    min: 15
    max: 30
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"
  inverted_high:
    name: Inverted High
    min: 15
    max: 30
    step: 0.5
    initial: 18
    unit_of_measurement: "°C"

  # Degenerate: both handles on the same value.
  equal_low:
    name: Equal Low
    min: 15
    max: 30
    step: 0.5
    initial: 20
    unit_of_measurement: "°C"
  equal_high:
    name: Equal High
    min: 15
    max: 30
    step: 0.5
    initial: 20
    unit_of_measurement: "°C"

  # Whole-number step, so the readout should show no decimals at all.
  # Held mid-drag while the screenshots are taken, so the captures show the
  # value popup and whatever the theme does to a handle being dragged.
  drag_low:
    name: Drag Low
    min: 15
    max: 30
    step: 0.5
    initial: 18
    unit_of_measurement: "°C"
  drag_high:
    name: Drag High
    min: 15
    max: 30
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"

  # Backing stores for the template number entities above.
  number_low_store:
    name: Number Low Store
    min: 0
    max: 100
    step: 1
    initial: 30
  number_high_store:
    name: Number High Store
    min: 0
    max: 100
    step: 1
    initial: 70

  # Deliberately narrower than its partner, so a handle can reach a value this
  # entity would reject and the card has to clamp before writing.
  narrow_low:
    name: Narrow Low
    min: 15
    max: 20
    step: 0.5
    initial: 16
  narrow_high:
    name: Narrow High
    min: 15
    max: 30
    step: 0.5
    initial: 28

  whole_low:
    name: Whole Low
    min: 0
    max: 100
    step: 1
    initial: 20
    unit_of_measurement: "%"
  whole_high:
    name: Whole High
    min: 0
    max: 100
    step: 1
    initial: 80
    unit_of_measurement: "%"

lovelace:
  mode: yaml
  # Written by tests/render.sh, so the Material You utilities module is only
  # registered when it has actually been downloaded.
  resources: !include resources.yaml
