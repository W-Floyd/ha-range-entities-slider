# Minimal Home Assistant config used only by the render test.
# This directory is copied to a temp dir before each run, so Home Assistant's
# generated .storage never lands in the repo.

frontend:
  # Empty when the theme sweep is off; populated by tests/install-themes.sh.
  themes: !include_dir_merge_named themes

input_number:
  lower_temp:
    name: Lower Temp
    min: 15
    max: 30
    step: 0.5
    initial: 18
    unit_of_measurement: "°C"
  upper_temp:
    name: Upper Temp
    min: 15
    max: 30
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"

  # Both handles pinned to the ends of the range.
  span_low:
    name: Span Low
    min: 15
    max: 30
    step: 0.5
    initial: 15
    unit_of_measurement: "°C"
  span_high:
    name: Span High
    min: 15
    max: 30
    step: 0.5
    initial: 30
    unit_of_measurement: "°C"

  # Deliberately inverted: the entity behind the lower handle holds the larger
  # value, so the card has to normalise the pair.
  inverted_low:
    name: Inverted Low
    min: 15
    max: 30
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"
  inverted_high:
    name: Inverted High
    min: 15
    max: 30
    step: 0.5
    initial: 18
    unit_of_measurement: "°C"

  # Degenerate: both handles on the same value.
  equal_low:
    name: Equal Low
    min: 15
    max: 30
    step: 0.5
    initial: 20
    unit_of_measurement: "°C"
  equal_high:
    name: Equal High
    min: 15
    max: 30
    step: 0.5
    initial: 20
    unit_of_measurement: "°C"

  # Whole-number step, so the readout should show no decimals at all.
  whole_low:
    name: Whole Low
    min: 0
    max: 100
    step: 1
    initial: 20
    unit_of_measurement: "%"
  whole_high:
    name: Whole High
    min: 0
    max: 100
    step: 1
    initial: 80
    unit_of_measurement: "%"

lovelace:
  mode: yaml
  # Written by tests/render.sh, so the Material You utilities module is only
  # registered when it has actually been downloaded.
  resources: !include resources.yaml
